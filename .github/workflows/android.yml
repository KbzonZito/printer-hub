name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build web app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      # Without the secrets every run gets a fresh debug key, so the APK can't be installed
      # as an update over the previous one. Run scripts/setup-signing.sh once to fix it.
      - name: Warn about missing signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::No signing secrets; this APK uses a throwaway debug key and won't update an installed app. Run scripts/setup-signing.sh."

      # A release tag must match the version in package.json (scripts/release.sh does both).
      - name: Check version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          # Builds from main that aren't releases are marked so they can't be mistaken.
          VERSION_SUFFIX: ${{ startsWith(github.ref, 'refs/tags/v') && '' || format('-dev.{0}', github.run_number) }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/printer-hub-${{ steps.version.outputs.version }}.apk"

      # Pushes to main only check that the app builds (APK kept as a workflow artifact).
      - uses: actions/upload-artifact@v4
        with:
          name: printer-hub-apk
          path: printer-hub-*.apk
          retention-days: 14

      # Version tags (v1.2.3) publish a numbered release with that version's changelog.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## / { p = index($0, "[" v "]") > 0; next }
            p
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "printer-hub-$VERSION.apk" \
            --title "Printer Hub $VERSION" --notes-file notes.md --latest
